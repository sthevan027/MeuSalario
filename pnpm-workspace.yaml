packages:
  - '.'

# Movido de package.json > pnpm.overrides em 2026-09-11 — pnpm 9.15.9 parou
# de ler esse campo em package.json ("no longer read by pnpm", aviso no
# install) e os overrides ficaram silenciosamente inativos. Achado ao
# investigar as 40 vulnerabilidades do Dependabot: brace-expansion e
# postcss já tinham override tentado antes, mas nunca foram aplicados de
# verdade por causa disso.
overrides:
  flatted: ^3.4.2
  brace-expansion: ^1.1.18
  postcss: ^8.5.23
  fast-uri: ^3.1.6
  nanoid: ^3.3.18
  js-yaml: ^4.3.1
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  uuid: ^11.1.1
  sharp: ^0.35.4
  '@opentelemetry/core': ^2.8.0
